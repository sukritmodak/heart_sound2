<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Heart Sound Monitor</title>
    <style>
        body {
            background-color: #0d0d12;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 5px; letter-spacing: 1px; }
        p { color: #aaaaaa; margin-bottom: 25px; text-align: center; }

        button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { background-color: #d81557; transform: translateY(-2px); }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }

        /* Stats Panel */
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 40px;
            background: #1a1a24;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            width: 100%;
            box-sizing: border-box;
        }

        .stat-box {
            text-align: center;
            min-width: 150px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            font-family: monospace;
            height: 45px;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .s1-s2-indicator {
            color: #e91e63;
            text-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
        }

        /* Controls Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a24;
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid #333;
            width: 100%;
            box-sizing: border-box;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .slider-container label {
            font-size: 14px;
            color: #bbb;
            white-space: nowrap;
        }

        input[type=range] {
            flex-grow: 1;
            accent-color: #e91e63;
        }

        /* Visuals Container */
        .visuals-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            width: 100%;
        }

        /* Heart Animation */
        .heart-container {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            background-color: #e91e63;
            width: 50px;
            height: 50px;
            position: relative;
            transform: rotate(-45deg) scale(1);
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
        }

        .heart::before, .heart::after {
            content: "";
            background-color: inherit;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            position: absolute;
        }
        .heart::before { top: -25px; left: 0; }
        .heart::after { top: 0; left: 25px; }

        @keyframes beatS1 {
            0% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px rgba(233, 30, 99, 0.4); }
            30% { transform: rotate(-45deg) scale(1.25); box-shadow: 0 0 40px rgba(233, 30, 99, 0.8); }
            100% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px rgba(233, 30, 99, 0.4); }
        }

        @keyframes beatS2 {
            0% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px rgba(233, 30, 99, 0.4); }
            20% { transform: rotate(-45deg) scale(1.4); box-shadow: 0 0 60px rgba(255, 64, 129, 1); background-color: #ff4081; }
            100% { transform: rotate(-45deg) scale(1); box-shadow: 0 0 20px rgba(233, 30, 99, 0.4); background-color: #e91e63; }
        }

        .pulse-s1 { animation: beatS1 0.2s ease-out; }
        .pulse-s2 { animation: beatS2 0.25s ease-out; }

        canvas {
            background-color: #111116;
            border: 2px solid #2a2a35;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>Heart Sound Monitor</h1>
    <p>Live S1/S2 Detection & Audio Visualizer.</p>

    <button id="connectBtn">Connect ESP32 (USB)</button>

    <div class="dashboard-container">
        
        <!-- Live BPM & Beat Stats -->
        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-value s1-s2-indicator" id="phaseDisplay">--</div>
                <div class="stat-label">Current Phase</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="bpmDisplay">0</div>
                <div class="stat-label">Live BPM (Updated per sec)</div>
            </div>
        </div>

        <!-- Sensitivity Slider -->
        <div class="controls-panel">
            <div class="slider-container">
                <label>Audio Sensitivity Threshold: <span id="threshText">0.15</span></label>
                <input type="range" id="thresholdSlider" min="0.02" max="0.80" step="0.01" value="0.15">
            </div>
            <p style="margin: 10px 0 0 0; font-size: 11px; color: #666;">Adjust so the pink dashed lines sit just above background noise.</p>
        </div>

        <div class="visuals-panel">
            <!-- Visual Heart -->
            <div class="heart-container">
                <div class="heart" id="heartIcon"></div>
            </div>
            
            <!-- Sound Waveform -->
            <canvas id="waveform" width="500" height="200"></canvas>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const heartIcon = document.getElementById('heartIcon');
        const phaseDisplay = document.getElementById('phaseDisplay');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const threshText = document.getElementById('threshText');
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');

        // Audio & Serial Variables
        let audioCtx;
        let nextAudioTime = 0;
        let port;
        let dataQueue = [];

        // Dynamic Threshold
        let AMPLITUDE_THRESHOLD = parseFloat(thresholdSlider.value);
        thresholdSlider.addEventListener('input', (e) => {
            AMPLITUDE_THRESHOLD = parseFloat(e.target.value);
            threshText.innerText = AMPLITUDE_THRESHOLD.toFixed(2);
        });

        // -------------------------------------------------------------
        // ABSOLUTE TIMING VARIABLES
        // -------------------------------------------------------------
        let totalSamplesReceived = 0;
        let lastDetectedEventMs = -Infinity;

        // S1/S2 state machine
        let waitingForS2 = false;
        let currentS1TimeMs = NaN;
        let previousS1TimeMs = NaN;

        // BPM is always based on S1 -> S1, never S1 -> S2
        let latestCalculatedBpm = 0;
        let bpmBuffer = [];

        // Continuous sample-level detector
        let detectorEnvelope = 0;
        let noiseFloor = 0.008;
        let inSoundBurst = false;
        let burstPeak = 0;
        let burstPeakSample = 0;
        let burstStartSample = 0;
        let belowThresholdSamples = 0;

        const SAMPLE_RATE = 4000;
        const MIN_EVENT_GAP_MS = 75;
        const S1_S2_MIN_MS = 100;
        const S1_S2_MAX_MS = 500;
        const MIN_S1_S1_MS = 300;
        const MAX_S1_S1_MS = 2000;

        // Draw initial flatline
        drawWaveform(new Uint8Array(128).fill(128));

        // =============================================================
        // EXACTLY 1-SECOND UI REFRESH TIMER
        // =============================================================
        setInterval(() => {
            // The displayed value is refreshed every second, but the value itself
            // comes only from the latest valid S1-to-S1 interval.
            if (latestCalculatedBpm > 0) {
                bpmDisplay.innerText = Math.round(latestCalculatedBpm);
            } else {
                bpmDisplay.innerText = "--";
            }
        }, 1000); // exactly 1 second

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                connectBtn.innerText = "Connected! Listening...";
                connectBtn.style.backgroundColor = "#4CAF50";

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                readSerialLoop();
            } catch (err) {
                console.error('Connection error:', err);
                alert("Failed to connect. Make sure Arduino Serial Monitor is closed.");
            }
        });

        async function readSerialLoop() {
            const reader = port.readable.getReader();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    for (let i = 0; i < value.length; i++) {
                        dataQueue.push(value[i]);
                    }
                    processQueue();
                }
            } catch (error) {
                console.error("Serial read error:", error);
            } finally {
                reader.releaseLock();
            }
        }

        function processQueue() {
            while (dataQueue.length >= 132) {
                if (dataQueue[0] === 0xA5 && dataQueue[1] === 0x5A && dataQueue[2] === 128) {
                    let payload = dataQueue.slice(3, 131);
                    let receivedChecksum = dataQueue[131];
                    
                    let calculatedSum = 0;
                    for (let i = 0; i < 128; i++) {
                        calculatedSum = (calculatedSum + payload[i]) & 0xFF; 
                    }

                    if (calculatedSum === receivedChecksum) {
                        playAndVisualize(payload);
                        dataQueue.splice(0, 132);
                    } else {
                        dataQueue.shift();
                    }
                } else {
                    dataQueue.shift();
                }
            }
        }

        function playAndVisualize(payload) {
            if (!audioCtx) return;

            const buffer = audioCtx.createBuffer(1, payload.length, SAMPLE_RATE);
            const channelData = buffer.getChannelData(0);

            for (let i = 0; i < payload.length; i++) {
                channelData[i] = (payload[i] - 128) / 128.0;
            }

            // Keep the audio stream continuous.
            if (nextAudioTime < audioCtx.currentTime) {
                nextAudioTime = audioCtx.currentTime + 0.02;
            } else if (nextAudioTime > audioCtx.currentTime + 0.30) {
                nextAudioTime = audioCtx.currentTime + 0.05;
            }

            const scheduledStart = nextAudioTime;
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(scheduledStart);
            nextAudioTime += buffer.duration;

            drawWaveform(payload);

            // IMPORTANT: analyse every sample, not just the loudest sample
            // in a 128-sample packet. This prevents S1/S2 timing from being lost.
            detectHeartSounds(payload);

            totalSamplesReceived += payload.length;
        }

        function detectHeartSounds(payload) {
            for (let i = 0; i < payload.length; i++) {
                const sample = (payload[i] - 128) / 128.0;
                const amplitude = Math.abs(sample);

                // Fast envelope follows heart-sound bursts.
                detectorEnvelope = 0.82 * detectorEnvelope + 0.18 * amplitude;

                // Slow noise-floor estimate. The heart-sound threshold is never
                // allowed to fall below the user's selected sensitivity.
                if (!inSoundBurst) {
                    noiseFloor = 0.995 * noiseFloor + 0.005 * Math.min(detectorEnvelope, 0.08);
                }

                const adaptiveThreshold = Math.max(
                    AMPLITUDE_THRESHOLD,
                    noiseFloor * 2.2
                );

                const globalSample = totalSamplesReceived + i;
                const currentTimeMs = (globalSample / SAMPLE_RATE) * 1000.0;

                if (!inSoundBurst) {
                    if (detectorEnvelope >= adaptiveThreshold &&
                        currentTimeMs - lastDetectedEventMs >= MIN_EVENT_GAP_MS) {

                        inSoundBurst = true;
                        burstPeak = detectorEnvelope;
                        burstPeakSample = globalSample;
                        burstStartSample = globalSample;
                        belowThresholdSamples = 0;
                    }
                } else {
                    if (detectorEnvelope > burstPeak) {
                        burstPeak = detectorEnvelope;
                        burstPeakSample = globalSample;
                    }

                    if (detectorEnvelope < adaptiveThreshold * 0.55) {
                        belowThresholdSamples++;
                    } else {
                        belowThresholdSamples = 0;
                    }

                    // End the burst only after a short quiet period.
                    // At 4 kHz, 24 samples = 6 ms.
                    if (belowThresholdSamples >= 24) {
                        const eventTimeMs = (burstPeakSample / SAMPLE_RATE) * 1000.0;

                        if (eventTimeMs - lastDetectedEventMs >= MIN_EVENT_GAP_MS) {
                            registerHeartSound(eventTimeMs);
                            lastDetectedEventMs = eventTimeMs;
                        }

                        inSoundBurst = false;
                        burstPeak = 0;
                        burstPeakSample = globalSample;
                        burstStartSample = globalSample;
                        belowThresholdSamples = 0;
                    }
                }
            }
        }

        function registerHeartSound(eventTimeMs) {
            if (!waitingForS2) {
                // First sound = S1.
                currentS1TimeMs = eventTimeMs;
                waitingForS2 = true;

                phaseDisplay.innerText = "S1 (LUB)";
                triggerAnimation('pulse-s1');
                return;
            }

            const s1s2Gap = eventTimeMs - currentS1TimeMs;

            if (s1s2Gap >= S1_S2_MIN_MS && s1s2Gap <= S1_S2_MAX_MS) {
                // Second sound = S2. It confirms the S1/S2 pair.
                waitingForS2 = false;
                phaseDisplay.innerText = "S2 (DUB)";
                triggerAnimation('pulse-s2');
                return;
            }

            if (s1s2Gap > S1_S2_MAX_MS) {
                // No valid S2 arrived. Treat this sound as the next S1.
                // THIS is where the S1 -> S1 BPM interval is calculated.
                calculateS1toS1Bpm(eventTimeMs);

                currentS1TimeMs = eventTimeMs;
                waitingForS2 = true;
                phaseDisplay.innerText = "S1 (LUB)";
                triggerAnimation('pulse-s1');
                return;
            }

            // Sound came too close to the previous S1 to be S2.
            // Ignore it instead of corrupting the BPM timing.
        }

        function calculateS1toS1Bpm(newS1TimeMs) {
            if (!Number.isFinite(previousS1TimeMs)) {
                previousS1TimeMs = newS1TimeMs;
                return;
            }

            const intervalMs = newS1TimeMs - previousS1TimeMs;

            if (intervalMs >= MIN_S1_S1_MS && intervalMs <= MAX_S1_S1_MS) {
                const instantBpm = 60000 / intervalMs;

                // Physiological display guard.
                if (instantBpm >= 30 && instantBpm <= 200) {
                    bpmBuffer.push(instantBpm);

                    // Short median/average smoothing prevents one noisy detection
                    // from making the displayed BPM jump wildly.
                    if (bpmBuffer.length > 3) bpmBuffer.shift();

                    const sorted = bpmBuffer.slice().sort((a, b) => a - b);
                    latestCalculatedBpm = sorted[Math.floor(sorted.length / 2)];
                }
            }

            // Always advance the S1 reference only after a valid timing step.
            // If the interval is invalid, keep the previous S1 so one noise event
            // cannot permanently corrupt the rhythm calculation.
            if (intervalMs >= MIN_S1_S1_MS && intervalMs <= MAX_S1_S1_MS) {
                previousS1TimeMs = newS1TimeMs;
            }
        }

        function triggerAnimation(animationClass) {
            heartIcon.classList.remove('pulse-s1', 'pulse-s2');
            void heartIcon.offsetWidth; // Force CSS reflow
            heartIcon.classList.add(animationClass);
        }

        function drawWaveform(payload) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = "#2a2a35";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            let upperVal = (AMPLITUDE_THRESHOLD * 128) + 128;
            let lowerVal = (-AMPLITUDE_THRESHOLD * 128) + 128;
            let upperY = (1 - (upperVal / 255.0)) * canvas.height;
            let lowerY = (1 - (lowerVal / 255.0)) * canvas.height;

            ctx.strokeStyle = "rgba(233, 30, 99, 0.5)";
            ctx.setLineDash([5, 5]); 
            ctx.beginPath();
            ctx.moveTo(0, upperY); ctx.lineTo(canvas.width, upperY);
            ctx.moveTo(0, lowerY); ctx.lineTo(canvas.width, lowerY);
            ctx.stroke();
            ctx.setLineDash([]); 

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            let sliceWidth = canvas.width / payload.length;
            let x = 0;

            for(let i = 0; i < payload.length; i++) {
                let v = payload[i] / 255.0; 
                let y = (1 - v) * canvas.height;
                if(i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
