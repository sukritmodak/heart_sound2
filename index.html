<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ESP32 Heart Sound Monitor</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin:5px 0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.card{
    background:#101d2e;
    border:1px solid #263b54;
    border-radius:14px;
    padding:18px;
}

.full{
    grid-column:1/-1;
}

.label{
    color:#91a8c2;
    font-size:14px;
    margin-bottom:8px;
}

.bpm{
    font-size:64px;
    font-weight:bold;
    text-align:center;
}

.phase{
    text-align:center;
    font-size:24px;
    margin-top:8px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
    background:#1677ff;
    color:white;
}

button:disabled{
    opacity:.5;
}

canvas{
    width:100%;
    height:260px;
    background:#020812;
    border-radius:10px;
    display:block;
}

.terminal{
    height:320px;
    overflow-y:auto;
    background:#02070d;
    border:1px solid #263b54;
    border-radius:10px;
    padding:12px;
    font-family:Consolas,monospace;
    font-size:13px;
    line-height:1.5;
    white-space:pre-wrap;
}

.status{
    text-align:center;
    margin-top:10px;
    color:#91a8c2;
}

@media(max-width:750px){
    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .bpm{
        font-size:52px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ ESP32 Heart Sound Monitor</h1>

<div class="grid">

    <!-- BPM -->
    <div class="card">
        <div class="label">LIVE BPM • S1→S1 • 1 SECOND</div>
        <div id="bpmDisplay" class="bpm">--</div>
        <div id="phaseDisplay" class="phase">Waiting for S1...</div>
    </div>

    <!-- CONNECTION -->
    <div class="card">
        <div class="label">ESP32 CONNECTION</div>

        <button id="usbBtn">
            Connect USB Stethoscope
        </button>

        <button id="bluetoothBtn">
            Connect Bluetooth Terminal
        </button>

        <div id="connectionStatus" class="status">
            Not connected
        </div>
    </div>

    <!-- WAVEFORM -->
    <div class="card full">
        <div class="label">REAL-TIME HEART SOUND WAVEFORM</div>
        <canvas id="waveCanvas" width="1100" height="260"></canvas>
    </div>

    <!-- BLUETOOTH TERMINAL -->
    <div class="card full">

        <div class="label">
            📡 ESP32 BLUETOOTH TERMINAL DATA
        </div>

        <div id="terminal" class="terminal">
Waiting for Bluetooth data...
        </div>

        <button id="clearTerminal">
            Clear Terminal
        </button>

    </div>

</div>

</div>

<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

const SAMPLE_RATE = 4000;

let port = null;
let reader = null;

let bluetoothDevice = null;
let bluetoothCharacteristic = null;

let audioBuffer = [];
let totalSamplesReceived = 0;

let previousS1TimeMs = NaN;
let currentS1TimeMs = NaN;
let waitingForS2 = false;

let bpmHistory = [];
let latestBpm = 0;
let bpmValid = false;

const MIN_S1_S1_MS = 300;
const MAX_S1_S1_MS = 2000;

const S1_S2_MIN_MS = 90;
const S1_S2_MAX_MS = 500;

const MIN_EVENT_GAP_MS = 70;


/* =========================================================
   DOM
========================================================= */

const bpmDisplay =
    document.getElementById("bpmDisplay");

const phaseDisplay =
    document.getElementById("phaseDisplay");

const terminal =
    document.getElementById("terminal");

const connectionStatus =
    document.getElementById("connectionStatus");

const canvas =
    document.getElementById("waveCanvas");

const ctx =
    canvas.getContext("2d");


/* =========================================================
   BLUETOOTH TERMINAL
========================================================= */

function addTerminalData(text){

    if(!text) return;

    const lines = text.split(/\r?\n/);

    lines.forEach(line => {

        line = line.trim();

        if(!line) return;

        const time =
            new Date().toLocaleTimeString();

        terminal.textContent +=
            `[${time}] ${line}\n`;

    });

    terminal.scrollTop =
        terminal.scrollHeight;
}


document
.getElementById("clearTerminal")
.addEventListener("click",()=>{

    terminal.textContent =
        "Terminal cleared...\n";

});


/* =========================================================
   WEB BLUETOOTH
========================================================= */

document
.getElementById("bluetoothBtn")
.addEventListener("click", connectBluetooth);


async function connectBluetooth(){

    try{

        if(!navigator.bluetooth){

            addTerminalData(
                "ERROR: Web Bluetooth is not supported by this browser."
            );

            return;
        }

        addTerminalData(
            "Searching for ESP32 Bluetooth device..."
        );

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices:true,

                optionalServices:[
                    "0000ffe0-0000-1000-8000-00805f9b34fb",
                    "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
                ]

            });


        addTerminalData(
            "Device selected: " +
            bluetoothDevice.name
        );


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            ()=>{
                addTerminalData(
                    "Bluetooth disconnected."
                );

                connectionStatus.textContent =
                    "Bluetooth disconnected";
            }
        );


        const server =
            await bluetoothDevice.gatt.connect();


        addTerminalData(
            "Bluetooth GATT connected."
        );


        /*
         * Try Nordic UART Service first
         */

        try{

            const service =
                await server.getPrimaryService(
                    "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
                );

            bluetoothCharacteristic =
                await service.getCharacteristic(
                    "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
                );

        }catch(e){

            /*
             * Try common HM-10 / BLE UART service
             */

            const service =
                await server.getPrimaryService(
                    "0000ffe0-0000-1000-8000-00805f9b34fb"
                );

            bluetoothCharacteristic =
                await service.getCharacteristic(
                    "0000ffe1-0000-1000-8000-00805f9b34fb"
                );

        }


        await bluetoothCharacteristic.startNotifications();


        bluetoothCharacteristic.addEventListener(
            "characteristicvaluechanged",
            bluetoothDataReceived
        );


        connectionStatus.textContent =
            "Bluetooth Terminal Connected";


        addTerminalData(
            "================================"
        );

        addTerminalData(
            "BLUETOOTH TERMINAL CONNECTED"
        );

        addTerminalData(
            "ESP32 terminal data will appear below."
        );

        addTerminalData(
            "================================"
        );


    }catch(error){

        console.error(error);

        addTerminalData(
            "Bluetooth ERROR: " +
            error.message
        );

        connectionStatus.textContent =
            "Bluetooth connection failed";
    }

}


/* =========================================================
   BLUETOOTH DATA RECEIVER
========================================================= */

function bluetoothDataReceived(event){

    const value =
        event.target.value;

    const decoder =
        new TextDecoder("utf-8");

    const text =
        decoder.decode(value);

    addTerminalData(text);

    processBluetoothMessage(text);
}


/* =========================================================
   BLUETOOTH MESSAGE PROCESSING
========================================================= */

function processBluetoothMessage(text){

    /*
     * S1 detected
     */

    if(
        text.includes("S1 detected") ||
        text.includes("S1 (LUB)")
    ){

        phaseDisplay.textContent =
            "S1 (LUB)";

        calculateBluetoothBpmFromS1(text);

    }


    /*
     * S2 detected
     */

    if(
        text.includes("S2 detected") ||
        text.includes("S2 (DUB)")
    ){

        phaseDisplay.textContent =
            "S2 (DUB)";
    }


    /*
     * Explicit BPM from ESP32
     */

    const bpmMatch =
        text.match(
            /BPM\s*(?:\(pair count\))?\s*=\s*([0-9.]+)/i
        );

    if(bpmMatch){

        const bpm =
            parseFloat(bpmMatch[1]);

        if(
            Number.isFinite(bpm) &&
            bpm >= 30 &&
            bpm <= 200
        ){

            /*
             * Keep the browser's S1→S1 BPM as
             * the main BPM.
             */

            addTerminalData(
                "ESP32 reported BPM: " +
                bpm.toFixed(1)
            );

        }

    }

}


/* =========================================================
   S1 → S1 BPM
========================================================= */

function calculateBluetoothBpmFromS1(text){

    /*
     * Use arrival time for Bluetooth S1 events.
     * The ESP32 sends every S1 message immediately.
     */

    const now =
        performance.now();


    if(
        Number.isFinite(previousS1TimeMs)
    ){

        const interval =
            now - previousS1TimeMs;


        if(
            interval >= MIN_S1_S1_MS &&
            interval <= MAX_S1_S1_MS
        ){

            const bpm =
                60000 / interval;


            if(
                bpm >= 30 &&
                bpm <= 200
            ){

                bpmHistory.push(bpm);

                if(bpmHistory.length > 3){
                    bpmHistory.shift();
                }


                const sorted =
                    bpmHistory
                    .slice()
                    .sort((a,b)=>a-b);


                latestBpm =
                    sorted[
                        Math.floor(
                            sorted.length / 2
                        )
                    ];


                bpmValid = true;


                bpmDisplay.textContent =
                    Math.round(latestBpm);


                addTerminalData(
                    "Browser S1→S1 BPM = " +
                    latestBpm.toFixed(1)
                );

            }

        }

    }


    previousS1TimeMs =
        now;
}


/* =========================================================
   USB SERIAL
========================================================= */

document
.getElementById("usbBtn")
.addEventListener(
    "click",
    connectUSB
);


async function connectUSB(){

    try{

        if(!("serial" in navigator)){

            addTerminalData(
                "ERROR: Web Serial is not supported."
            );

            return;
        }


        port =
            await navigator.serial.requestPort();


        await port.open({
            baudRate:115200
        });


        connectionStatus.textContent =
            "USB Serial Connected";


        addTerminalData(
            "USB ESP32 connected at 115200 baud."
        );


        readUSBSerial();


    }catch(error){

        addTerminalData(
            "USB ERROR: " +
            error.message
        );

    }

}


/* =========================================================
   USB SERIAL READER
========================================================= */

async function readUSBSerial(){

    const decoder =
        new TextDecoderStream();

    const readableStreamClosed =
        port.readable.pipeTo(
            decoder.writable
        );

    reader =
        decoder.readable.getReader();


    let textBuffer = "";


    try{

        while(true){

            const {
                value,
                done
            } = await reader.read();


            if(done) break;


            textBuffer += value;


            const lines =
                textBuffer.split(/\r?\n/);


            textBuffer =
                lines.pop();


            for(
                const line of lines
            ){

                if(line.trim()){

                    /*
                     * SHOW USB SERIAL TERMINAL
                     */

                    addTerminalData(
                        "USB: " +
                        line
                    );


                    processBluetoothMessage(
                        line
                    );

                }

            }

        }

    }catch(error){

        addTerminalData(
            "USB reader error: " +
            error.message
        );

    }

}

/* =========================================================
   WAVEFORM
========================================================= */

function drawWaveform(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.beginPath();


    const visible =
        audioBuffer.slice(-1000);


    if(visible.length < 2){

        requestAnimationFrame(
            drawWaveform
        );

        return;
    }


    for(
        let i=0;
        i<visible.length;
        i++
    ){

        const x =
            i /
            (visible.length-1) *
            canvas.width;


        const y =
            canvas.height/2 -
            (visible[i]-128) *
            0.9;


        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    }


    ctx.strokeStyle =
        "#22d3ee";

    ctx.lineWidth=2;

    ctx.stroke();


    requestAnimationFrame(
        drawWaveform
    );

}

drawWaveform();


/* =========================================================
   BPM DISPLAY — EVERY 1 SECOND
========================================================= */

setInterval(()=>{

    if(bpmValid){

        bpmDisplay.textContent =
            String(
                Math.round(latestBpm)
            );

    }else{

        bpmDisplay.textContent =
            "--";

    }

},1000);


/* =========================================================
   DEMO / AUDIO PACKET HANDLER
========================================================= */

function handleAudioPacket(payload){

    for(
        let i=0;
        i<payload.length;
        i++
    ){

        audioBuffer.push(
            payload[i]
        );

    }


    if(audioBuffer.length > 4000){

        audioBuffer =
            audioBuffer.slice(-4000);

    }

}


</script>
